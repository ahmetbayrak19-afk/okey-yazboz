<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Okey Yazboz">
  <title>Okey Yazboz</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --primary: #3b82f6;
      --success: #22c55e;
      --danger: #ef4444;
      --warning: #f59e0b;
      --text: #f1f5f9;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 12px;
      line-height: 1.4;
    }
    .screen { display: none; max-width: 520px; margin: 0 auto; }
    .screen.active { display: block; }
    h1 { text-align: center; font-size: 1.5rem; margin: 12px 0; }
    h2 { font-size: 1.15rem; margin-bottom: 10px; }
    .btn {
      display: block; width: 100%; padding: 13px; border: none; border-radius: 12px;
      font-size: 1rem; font-weight: 600; cursor: pointer; margin-bottom: 8px;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary { background: var(--primary); color: white; }
    .btn-success { background: var(--success); color: white; }
    .btn-danger { background: var(--danger); color: white; }
    .btn-warning { background: var(--warning); color: #000; }
    .btn-outline {
      background: transparent; border: 2px solid var(--primary); color: var(--primary);
    }
    .btn-sm { padding: 9px 6px; font-size: 0.85rem; }
    input[type="text"], input[type="number"] {
      width: 100%; padding: 11px; border-radius: 10px; border: 2px solid #334155;
      background: var(--card); color: var(--text); font-size: 1rem; margin-bottom: 8px;
    }
    .card {
      background: var(--card); border-radius: 14px; padding: 14px; margin-bottom: 10px;
    }
    .hand-info {
      text-align: center;
      margin-bottom: 14px;
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--text);
    }
    .teams-row {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }
    .team-card {
      flex: 1;
      background: var(--card);
      border-radius: 14px;
      padding: 12px 10px;
      text-align: center;
    }
    .team-name {
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .score-value {
      font-size: 2.1rem;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .score-input {
      width: 100%;
      padding: 10px 6px;
      border-radius: 10px;
      border: 2px solid #334155;
      background: #0f172a;
      color: var(--text);
      font-size: 1.1rem;
      text-align: center;
      margin-bottom: 8px;
    }
    .team-actions {
      display: flex;
      gap: 6px;
    }
    .team-actions .btn {
      flex: 1;
      margin-bottom: 0;
      padding: 10px 4px;
      font-size: 0.82rem;
    }
    .diff-box {
      text-align: center;
      padding: 14px;
      background: var(--card);
      border-radius: 14px;
      margin-bottom: 12px;
      transition: background 0.3s;
    }
    .diff-box.warning-red {
      background: #7f1d1d;
    }
    .diff-value {
      font-size: 1.8rem;
      font-weight: 700;
    }
    .diff-label {
      font-size: 1rem;
      color: var(--muted);
      margin-top: 4px;
    }
    .diff-box.warning-red .diff-label {
      color: #fecaca;
    }
    .history-box {
      background: var(--card);
      border-radius: 14px;
      padding: 12px;
      margin-top: 12px;
      margin-bottom: 10px;
    }
    .history-box h3 {
      font-size: 0.95rem;
      color: var(--muted);
      margin-bottom: 8px;
      text-align: center;
    }
    .score-table {
      width: 100%;
      border-collapse: collapse;
    }
    .score-table th, .score-table td {
      padding: 8px 4px;
      text-align: center;
      border-bottom: 1px solid #334155;
    }
    .score-table th {
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 600;
    }
    .score-table td {
      font-size: 1rem;
      font-weight: 600;
    }
    .score-table .el-col {
      color: var(--muted);
      font-weight: 500;
      font-size: 0.85rem;
    }
    .del-btn {
      background: transparent;
      border: none;
      color: #f87171;
      font-size: 0.85rem;
      cursor: pointer;
      padding: 4px 8px;
    }
    .iddia-box {
      background: var(--card);
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .iddia-item {
      padding: 8px 0;
      border-bottom: 1px solid #334155;
      font-size: 0.9rem;
    }
    .winner-box {
      text-align: center; padding: 24px; background: linear-gradient(135deg, #166534, #14532d);
      border-radius: 16px; margin: 20px 0;
    }
    .winner-box h2 { font-size: 1.4rem; margin-bottom: 8px; }
    .flex-between { display: flex; justify-content: space-between; gap: 8px; }
    .small { font-size: 0.85rem; color: var(--muted); }
    .score-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  </style>
</head>
<body>

  <div id="screen-start" class="screen active">
    <h1>🀄️ Okey Yazboz</h1>
    <div class="card">
      <h2>Oyun Seç</h2>
      <button class="btn btn-primary" onclick="selectGame('101')">101 Okey</button>
      <button class="btn btn-primary" onclick="selectGame('81')">81 Okey (Eşli)</button>
    </div>
    <div class="iddia-box" id="start-iddia-box">
      <h3 style="text-align:center;margin-bottom:8px;color:var(--muted)">Kayıtlı İddialar</h3>
      <div id="start-iddia-list"></div>
    </div>
  </div>

  <div id="screen-101-mode" class="screen">
    <h1>101 Okey</h1>
    <div class="card">
      <h2>Mod Seç</h2>
      <button class="btn btn-primary" onclick="selectMode('tekli')">Tekli (4 Oyuncu)</button>
      <button class="btn btn-primary" onclick="selectMode('esli')">Eşli (2 Takım)</button>
      <button class="btn btn-outline" onclick="goBack()">← Geri</button>
    </div>
  </div>

  <div id="screen-names" class="screen">
    <h1 id="names-title">İsimleri Gir</h1>
    <div class="card" id="names-form"></div>
    <button class="btn btn-success" onclick="startGame()">Oyuna Başla</button>
    <button class="btn btn-outline" onclick="goBack()">← Geri</button>
  </div>

  <div id="screen-game" class="screen">
    <div class="hand-info" id="hand-number">1. El</div>

    <div id="scores-container"></div>

    <div class="diff-box" id="diff-box">
      <div class="diff-value" id="diff-value">0</div>
      <div class="diff-label" id="diff-label">Berabere</div>
    </div>

    <button class="btn btn-outline" onclick="newHand()">Yeni El / Devam</button>
    <button class="btn btn-warning" onclick="addIddia()">İddia Kaydet</button>
    <button class="btn btn-danger" onclick="finishGame()">Oyunu Bitir</button>

    <div class="history-box" id="history-box">
      <h3>El Skorları</h3>
      <div id="history-list"></div>
    </div>

    <div class="iddia-box" id="game-iddia-box">
      <h3 style="text-align:center;margin-bottom:8px;color:var(--muted)">İddialar</h3>
      <div id="game-iddia-list"></div>
    </div>
  </div>

  <div id="screen-end" class="screen">
    <h1>Oyun Bitti</h1>
    <div class="winner-box" id="winner-box"></div>
    <div class="card" id="final-scores"></div>
    <button class="btn btn-primary" onclick="resetApp()">Yeni Oyun</button>
  </div>

  <script>
    let state = {
      game: null,
      mode: null,
      players: [],
      scores: [],
      hand: 1,
      currentHand: [0, 0],
      handHistory: []
    };

    // İddiaları localStorage'dan yükle
    function loadIddialar() {
      try {
        return JSON.parse(localStorage.getItem('okey_iddialar') || '[]');
      } catch {
        return [];
      }
    }

    function saveIddialar(list) {
      localStorage.setItem('okey_iddialar', JSON.stringify(list));
    }

    function renderIddialar() {
      const list = loadIddialar();
      const startEl = document.getElementById('start-iddia-list');
      const gameEl = document.getElementById('game-iddia-list');

      if (list.length === 0) {
        if (startEl) startEl.innerHTML = '<p class="small" style="text-align:center">Henüz iddia yok</p>';
        if (gameEl) gameEl.innerHTML = '<p class="small" style="text-align:center">Henüz iddia yok</p>';
        return;
      }

      // Takım isimlerine göre grupla
      const grouped = {};
      list.forEach((item, idx) => {
        const key = item.teams || 'Genel';
        if (!grouped[key]) grouped[key] = [];
        grouped[key].push({ ...item, idx });
      });

      let html = '';
      Object.keys(grouped).forEach(key => {
        html += `<div style="margin-bottom:10px"><strong style="color:var(--primary)">${key}</strong>`;
        grouped[key].forEach(item => {
          html += `<div class="iddia-item">${item.text} <button class="del-btn" onclick="deleteIddia(${item.idx})">sil</button></div>`;
        });
        html += `</div>`;
      });

      if (startEl) startEl.innerHTML = html;
      if (gameEl) gameEl.innerHTML = html;
    }

    function addIddia() {
      const text = prompt('İddia nedir? (örnek: kaybeden kebap ısmarlayacak)');
      if (!text || !text.trim()) return;

      const teams = state.players.length >= 2
        ? state.players[0] + ' vs ' + state.players[1]
        : 'Genel';

      const list = loadIddialar();
      list.push({
        text: text.trim(),
        teams: teams,
        date: new Date().toLocaleDateString('tr-TR')
      });
      saveIddialar(list);
      renderIddialar();
      alert('İddia kaydedildi');
    }

    function deleteIddia(idx) {
      if (!confirm('Bu iddiayı silmek istiyor musun?')) return;
      const list = loadIddialar();
      list.splice(idx, 1);
      saveIddialar(list);
      renderIddialar();
    }

    function selectGame(game) {
      state.game = game;
      if (game === '81') {
        state.mode = 'esli';
        showScreen('screen-names');
        renderNamesForm();
      } else {
        showScreen('screen-101-mode');
      }
    }

    function selectMode(mode) {
      state.mode = mode;
      showScreen('screen-names');
      renderNamesForm();
    }

    function renderNamesForm() {
      const form = document.getElementById('names-form');
      const title = document.getElementById('names-title');
      form.innerHTML = '';

      if (state.mode === 'esli') {
        title.textContent = 'Takım İsimleri';
        form.innerHTML = `
          <label class="small">Sol Takım</label>
          <input type="text" id="name0" placeholder="Örn: Ahmet & Mehmet" value="Takım 1">
          <label class="small">Sağ Takım</label>
          <input type="text" id="name1" placeholder="Örn: Ali & Veli" value="Takım 2">
        `;
      } else {
        title.textContent = 'Oyuncu İsimleri';
        for (let i = 0; i < 4; i++) {
          form.innerHTML += `
            <label class="small">Oyuncu ${i+1}</label>
            <input type="text" id="name${i}" placeholder="Oyuncu ${i+1}" value="Oyuncu ${i+1}">
          `;
        }
      }
    }

    function startGame() {
      const count = state.mode === 'esli' ? 2 : 4;
      state.players = [];
      state.scores = [];
      state.currentHand = new Array(count).fill(0);
      for (let i = 0; i < count; i++) {
        const val = document.getElementById('name' + i).value.trim() || `Takım ${i+1}`;
        state.players.push(val);
        state.scores.push(0);
      }
      state.hand = 1;
      state.handHistory = [];
      showScreen('screen-game');
      renderGame();
      renderHistory();
      renderIddialar();
    }

    function renderGame() {
      document.getElementById('hand-number').textContent = state.hand + '. El';

      const container = document.getElementById('scores-container');
      container.innerHTML = '';

      if (state.mode === 'esli') {
        const row = document.createElement('div');
        row.className = 'teams-row';

        state.players.forEach((name, i) => {
          const card = document.createElement('div');
          card.className = 'team-card';
          card.innerHTML = `
            <div class="team-name">${name}</div>
            <div class="score-value" id="score-${i}">${state.scores[i]}</div>
            <input type="number" class="score-input" id="input-${i}" placeholder="Puan" inputmode="numeric">
            <div class="team-actions">
              <button class="btn btn-danger btn-sm" onclick="addPenalty(${i}, 50)">+50</button>
              <button class="btn btn-success btn-sm" onclick="addKafa(${i})">Kafa</button>
            </div>
          `;
          row.appendChild(card);
        });

        container.appendChild(row);

        // Enter basınca HER İKİ inputu da kaydet
        state.players.forEach((_, i) => {
          const input = document.getElementById('input-' + i);
          input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
              e.preventDefault();
              saveAllInputs();
            }
          });
        });
      } else {
        state.players.forEach((name, i) => {
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <div class="score-row">
              <div class="team-name">${name}</div>
              <div class="score-value" id="score-${i}">${state.scores[i]}</div>
            </div>
            <input type="number" class="score-input" id="input-${i}" placeholder="Puan" inputmode="numeric">
            <div class="team-actions">
              <button class="btn btn-danger btn-sm" onclick="addPenalty(${i}, 50)">+50</button>
              <button class="btn btn-success btn-sm" onclick="addKafa(${i})">Kafa</button>
            </div>
          `;
          container.appendChild(card);

          const input = document.getElementById('input-' + i);
          input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
              e.preventDefault();
              saveAllInputs();
            }
          });
        });
      }

      updateDiff();
    }

    // Her iki (veya tüm) inputtaki değerleri kaydet
    function saveAllInputs() {
      state.players.forEach((_, i) => {
        const input = document.getElementById('input-' + i);
        if (!input) return;
        const val = parseInt(input.value);
        if (!isNaN(val) && input.value !== '') {
          state.scores[i] += val;
          state.currentHand[i] += val;
          input.value = '';
        }
      });
      updateScores();
      updateDiff();
    }

    function renderHistory() {
      const list = document.getElementById('history-list');

      if (state.handHistory.length === 0) {
        list.innerHTML = '<p class="small" style="text-align:center">Henüz el yok</p>';
        return;
      }

      let html = `
        <table class="score-table">
          <thead>
            <tr>
              <th>El</th>
              <th>${state.players[0] || 'Takım 1'}</th>
              <th>${state.players[1] || 'Takım 2'}</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
      `;

      state.handHistory.forEach((r, idx) => {
        html += `
          <tr>
            <td class="el-col">${r.hand}. El</td>
            <td>${r.scores[0] || 0}</td>
            <td>${r.scores[1] || 0}</td>
            <td><button class="del-btn" onclick="deleteHand(${idx})">sil</button></td>
          </tr>
        `;
      });

      html += `</tbody></table>`;
      list.innerHTML = html;
    }

    function deleteHand(idx) {
      if (!confirm((idx + 1) + '. eli silmek istiyor musun?')) return;

      const removed = state.handHistory[idx];
      // Toplam skordan çıkar
      removed.scores.forEach((s, i) => {
        state.scores[i] -= (s || 0);
      });

      state.handHistory.splice(idx, 1);
      updateScores();
      updateDiff();
      renderHistory();
    }

    function addPenalty(index, amount) {
      state.scores[index] += amount;
      state.currentHand[index] += amount;
      updateScores();
      updateDiff();
    }

    function addKafa(index) {
      state.scores[index] -= 100;
      state.currentHand[index] -= 100;
      updateScores();
      updateDiff();
    }

    function updateScores() {
      state.scores.forEach((s, i) => {
        const el = document.getElementById('score-' + i);
        if (el) el.textContent = s;
      });
    }

    function updateDiff() {
      if (state.mode !== 'esli' || state.players.length < 2) return;

      const diff = Math.abs(state.scores[0] - state.scores[1]);
      document.getElementById('diff-value').textContent = diff;

      const box = document.getElementById('diff-box');
      // 10. ve 11. elde kırmızı arka plan
      if (state.hand === 10 || state.hand === 11) {
        box.classList.add('warning-red');
      } else {
        box.classList.remove('warning-red');
      }

      if (state.scores[0] < state.scores[1]) {
        document.getElementById('diff-label').textContent = state.players[0] + ' önde';
      } else if (state.scores[1] < state.scores[0]) {
        document.getElementById('diff-label').textContent = state.players[1] + ' önde';
      } else {
        document.getElementById('diff-label').textContent = 'Berabere';
      }
    }

    function newHand() {
      // Önce açık kalan inputları da kaydet
      saveAllInputs();

      state.handHistory.push({
        hand: state.hand,
        scores: [...state.currentHand]
      });

      state.hand++;
      state.currentHand = new Array(state.players.length).fill(0);
      renderGame();
      renderHistory();
    }

    function finishGame() {
      saveAllInputs();

      if (state.currentHand.some(v => v !== 0) || state.handHistory.length === 0) {
        state.handHistory.push({
          hand: state.hand,
          scores: [...state.currentHand]
        });
      }

      showScreen('screen-end');
      const min = Math.min(...state.scores);
      const winners = state.players.filter((_, i) => state.scores[i] === min);

      document.getElementById('winner-box').innerHTML = `
        <h2>🏆 Kazanan</h2>
        <div style="font-size:1.3rem;font-weight:700">${winners.join(' & ')}</div>
        <div class="small" style="margin-top:8px">${min} puan</div>
      `;

      let html = '<h2>Final Skorlar</h2>';
      state.players.forEach((p, i) => {
        html += `<div class="score-row"><span>${p}</span><strong>${state.scores[i]}</strong></div>`;
      });
      document.getElementById('final-scores').innerHTML = html;
    }

    function resetApp() {
      state = {
        game: null, mode: null, players: [], scores: [],
        hand: 1, currentHand: [0, 0], handHistory: []
      };
      showScreen('screen-start');
      renderIddialar();
    }

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    function goBack() {
      if (state.game === '101' && document.getElementById('screen-names').classList.contains('active')) {
        showScreen('screen-101-mode');
      } else {
        showScreen('screen-start');
        renderIddialar();
      }
    }

    // Sayfa açılınca iddiaları göster
    renderIddialar();
  </script>
</body>
</html>
