<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#111111">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Okey Yazboz">
  <title>Okey Yazboz</title>
  <style>
    :root {
      --bg: #111111;
      --card: #1c1c1c;
      --row: #242424;
      --input: #2c2c2c;
      --line: #333;
      --text: #f2f2f2;
      --muted: #9a9a9a;
      --green: #2e7d4f;
      --red: #b44545;
      --blue: #2b3a4a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 14px;
    }
    .screen { display: none; max-width: 480px; margin: 0 auto; }
    .screen.active { display: block; }
    h1 { text-align: center; font-size: 1.45rem; margin: 10px 0 16px; font-weight: 700; }
    h2 { font-size: 1.05rem; margin-bottom: 10px; }
    .btn {
      display: block; width: 100%; padding: 13px; border: none; border-radius: 10px;
      font-size: 1rem; font-weight: 600; cursor: pointer; margin-bottom: 8px; color: #fff;
    }
    .btn:active { opacity: 0.85; }
    .btn-green { background: var(--green); }
    .btn-red { background: var(--red); }
    .btn-dark { background: #2a2a2a; color: var(--muted); }
    .btn-outline { background: transparent; border: 1px solid #444; color: var(--text); }
    .btn-half { width: calc(50% - 4px); margin-bottom: 8px; }
    .row-btns { display: flex; gap: 8px; }
    input[type="text"], input[type="number"] {
      width: 100%; padding: 11px; border-radius: 10px; border: 1px solid #333;
      background: var(--input); color: var(--text); font-size: 1rem; margin-bottom: 8px;
    }
    .card { background: var(--card); border-radius: 12px; padding: 14px; margin-bottom: 10px; }
    .small { font-size: 0.85rem; color: var(--muted); }
    .names-top {
      display: flex; gap: 8px; margin-bottom: 10px;
    }
    .name-pill {
      flex: 1; background: var(--row); border-radius: 10px; padding: 10px 8px;
      text-align: center; font-weight: 600; font-size: 0.95rem;
    }
    .hand-row {
      display: flex; align-items: center; gap: 8px;
      background: var(--row); border-radius: 10px; padding: 8px;
      margin-bottom: 7px;
    }
    .hand-row.late { background: #3a1e1e; }
    .hand-label {
      width: 48px; flex-shrink: 0; color: var(--muted); font-size: 0.9rem; font-weight: 600;
    }
    .hand-input {
      flex: 1; margin: 0; text-align: center; padding: 9px 4px;
      background: #1a1a1a; border: 1px solid #333; border-radius: 8px;
      color: var(--text); font-size: 1.05rem; font-weight: 600;
    }
    .rank-box {
      background: var(--blue);
      border-radius: 12px;
      padding: 14px;
      text-align: center;
      margin: 10px 0;
    }
    .rank-box h3 { margin-bottom: 8px; font-size: 1.05rem; }
    .rank-line { font-size: 0.98rem; margin: 3px 0; }
    .diff-line {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(255,255,255,0.12);
      font-size: 1.15rem;
      font-weight: 700;
    }
    .diff-sub { font-size: 0.9rem; color: #c9d6e0; font-weight: 500; margin-top: 3px; }
    .iddia-box { background: var(--card); border-radius: 12px; padding: 12px; margin-bottom: 10px; }
    .iddia-item { padding: 8px 0; border-bottom: 1px solid #333; font-size: 0.9rem; }
    .iddia-link {
      display: block; padding: 12px; margin-bottom: 8px; background: #1a1a1a;
      border-radius: 10px; color: #8ab4ff; font-weight: 600; cursor: pointer; border: 1px solid #333;
    }
    .iddia-detail { display: none; padding: 8px 4px 4px; }
    .iddia-detail.open { display: block; }
    .del-btn { background: none; border: none; color: #e08080; font-size: 0.85rem; cursor: pointer; padding: 4px 8px; }
    .winner-box {
      text-align: center; padding: 22px; background: #1e3a2a; border-radius: 12px; margin: 16px 0;
    }
  </style>
</head>
<body>

  <div id="screen-start" class="screen active">
    <h1>Okey Yazboz</h1>
    <div class="card">
      <h2>Oyun Seç</h2>
      <button class="btn btn-green" onclick="selectGame('101')">101 Okey</button>
      <button class="btn btn-green" onclick="selectGame('81')">81 Okey (Eşli)</button>
    </div>
    <div class="iddia-box">
      <h3 style="text-align:center;margin-bottom:8px;color:var(--muted);font-size:0.95rem">Kayıtlı İddialar</h3>
      <div id="start-iddia-list"></div>
    </div>
  </div>

  <div id="screen-101-mode" class="screen">
    <h1>101 Okey</h1>
    <div class="card">
      <h2>Mod Seç</h2>
      <button class="btn btn-green" onclick="selectMode('tekli')">Tekli (4 Oyuncu)</button>
      <button class="btn btn-green" onclick="selectMode('esli')">Eşli (2 Takım)</button>
      <button class="btn btn-outline" onclick="goBack()">← Geri</button>
    </div>
  </div>

  <div id="screen-names" class="screen">
    <h1 id="names-title">İsimleri Gir</h1>
    <div class="card" id="names-form"></div>
    <button class="btn btn-green" onclick="startGame()">Oyuna Başla</button>
    <button class="btn btn-outline" onclick="goBack()">← Geri</button>
  </div>

  <div id="screen-game" class="screen">
    <h1>Takımlı Oyun</h1>
    <div class="names-top">
      <div class="name-pill" id="name-pill-0">Takım 1</div>
      <div class="name-pill" id="name-pill-1">Takım 2</div>
    </div>
    <div id="hands-list"></div>
    <button class="btn btn-green" onclick="addHand()">+ Yeni El</button>
    <div class="row-btns">
      <button class="btn btn-red btn-half" id="btn-ceza-0" onclick="quickAdd(0, 50)">+50</button>
      <button class="btn btn-red btn-half" id="btn-ceza-1" onclick="quickAdd(1, 50)">+50</button>
    </div>
    <div class="row-btns">
      <button class="btn btn-green btn-half" id="btn-kafa-0" onclick="quickAdd(0, -100)">Kafa</button>
      <button class="btn btn-green btn-half" id="btn-kafa-1" onclick="quickAdd(1, -100)">Kafa</button>
    </div>
    <div class="rank-box" id="rank-box">
      <h3>Sıralama</h3>
      <div id="rank-list"></div>
      <div class="diff-line" id="diff-line">Fark: 0</div>
      <div class="diff-sub" id="diff-sub">Berabere</div>
    </div>
    <button class="btn btn-outline" onclick="addIddia()">İddia Kaydet</button>
    <button class="btn btn-red" onclick="finishGame()">Oyunu Bitir</button>
    <button class="btn btn-dark" onclick="resetApp()">Oyunu Sıfırla</button>
    <div class="iddia-box">
      <h3 style="text-align:center;margin-bottom:8px;color:var(--muted);font-size:0.95rem">Bu Takımların İddiaları</h3>
      <div id="game-iddia-list"></div>
    </div>
  </div>

  <div id="screen-end" class="screen">
    <h1>Oyun Bitti</h1>
    <div class="winner-box" id="winner-box"></div>
    <div class="card" id="final-scores"></div>
    <button class="btn btn-green" onclick="resetApp()">Yeni Oyun</button>
  </div>

  <script>
    let state = {
      game: null,
      mode: null,
      players: [],
      hands: []
    };

    function emptyHand() {
      return state.mode === 'esli' ? [0, 0] : [0, 0, 0, 0];
    }

    function loadIddialar() {
      try { return JSON.parse(localStorage.getItem('okey_iddialar') || '[]'); }
      catch { return []; }
    }
    function saveIddialar(list) {
      localStorage.setItem('okey_iddialar', JSON.stringify(list));
    }
    function getCurrentTeamsKey() {
      if (state.players.length < 2) return null;
      return [state.players[0], state.players[1]].sort().join(' vs ');
    }
    function normalizeTeamsKey(key) {
      if (!key || key === 'Genel') return key;
      const parts = key.split(' vs ').map(s => s.trim());
      return parts.length === 2 ? parts.sort().join(' vs ') : key;
    }

    function totals() {
      const n = state.players.length;
      const t = new Array(n).fill(0);
      state.hands.forEach(h => {
        for (let i = 0; i < n; i++) t[i] += Number(h[i] || 0);
      });
      return t;
    }

    function renderIddialar() {
      const list = loadIddialar();
      const startEl = document.getElementById('start-iddia-list');
      const gameEl = document.getElementById('game-iddia-list');

      if (startEl) {
        if (!list.length) {
          startEl.innerHTML = '<p class="small" style="text-align:center">Henüz iddia yok</p>';
        } else {
          const grouped = {};
          list.forEach((item, idx) => {
            const key = normalizeTeamsKey(item.teams || 'Genel');
            if (!grouped[key]) grouped[key] = [];
            grouped[key].push({ ...item, idx });
          });
          let html = '';
          Object.keys(grouped).forEach((key, gIdx) => {
            const id = 'iddia-group-' + gIdx;
            html += `<div class="iddia-link" onclick="toggleIddiaGroup('${id}')">${key} (${grouped[key].length})</div><div class="iddia-detail" id="${id}">`;
            grouped[key].forEach(item => {
              html += `<div class="iddia-item">${item.text} <span class="small">(${item.date || ''})</span> <button class="del-btn" onclick="event.stopPropagation();deleteIddia(${item.idx})">sil</button></div>`;
            });
            html += '</div>';
          });
          startEl.innerHTML = html;
        }
      }

      if (gameEl) {
        const currentKey = getCurrentTeamsKey();
        if (!currentKey) {
          gameEl.innerHTML = '<p class="small" style="text-align:center">-</p>';
          return;
        }
        const filtered = list.map((item, idx) => ({ ...item, idx }))
          .filter(item => normalizeTeamsKey(item.teams || '') === currentKey);
        if (!filtered.length) {
          gameEl.innerHTML = '<p class="small" style="text-align:center">Bu takımlar arasında iddia yok</p>';
        } else {
          gameEl.innerHTML = filtered.map(item =>
            `<div class="iddia-item">${item.text} <span class="small">(${item.date || ''})</span> <button class="del-btn" onclick="deleteIddia(${item.idx})">sil</button></div>`
          ).join('');
        }
      }
    }

    function toggleIddiaGroup(id) {
      const el = document.getElementById(id);
      if (el) el.classList.toggle('open');
    }
    function addIddia() {
      const text = prompt('İddia nedir? (örnek: kaybeden kebap ısmarlayacak)');
      if (!text || !text.trim()) return;
      const list = loadIddialar();
      list.push({ text: text.trim(), teams: getCurrentTeamsKey() || 'Genel', date: new Date().toLocaleDateString('tr-TR') });
      saveIddialar(list);
      renderIddialar();
    }
    function deleteIddia(idx) {
      if (!confirm('Bu iddiayı silmek istiyor musun?')) return;
      const list = loadIddialar();
      list.splice(idx, 1);
      saveIddialar(list);
      renderIddialar();
    }

    function selectGame(game) {
      state.game = game;
      if (game === '81') {
        state.mode = 'esli';
        showScreen('screen-names');
        renderNamesForm();
      } else {
        showScreen('screen-101-mode');
      }
    }
    function selectMode(mode) {
      state.mode = mode;
      showScreen('screen-names');
      renderNamesForm();
    }
    function renderNamesForm() {
      const form = document.getElementById('names-form');
      const title = document.getElementById('names-title');
      if (state.mode === 'esli') {
        title.textContent = 'Takım İsimleri';
        form.innerHTML = `
          <label class="small">Sol Takım</label>
          <input type="text" id="name0" placeholder="Örn: Merve" value="Takım 1">
          <label class="small">Sağ Takım</label>
          <input type="text" id="name1" placeholder="Örn: Ahmet" value="Takım 2">
        `;
      } else {
        title.textContent = 'Oyuncu İsimleri';
        form.innerHTML = '';
        for (let i = 0; i < 4; i++) {
          form.innerHTML += `<label class="small">Oyuncu ${i+1}</label><input type="text" id="name${i}" value="Oyuncu ${i+1}">`;
        }
      }
    }

    function startGame() {
      const count = state.mode === 'esli' ? 2 : 4;
      state.players = [];
      for (let i = 0; i < count; i++) {
        state.players.push((document.getElementById('name' + i).value.trim()) || ('Takım ' + (i + 1)));
      }
      state.hands = [];
      for (let i = 0; i < 11; i++) state.hands.push(emptyHand());
      showScreen('screen-game');
      renderGame();
      renderIddialar();
    }

    function renderGame() {
      if (state.players.length >= 2) {
        document.getElementById('name-pill-0').textContent = state.players[0];
        document.getElementById('name-pill-1').textContent = state.players[1];
        document.getElementById('btn-ceza-0').textContent = '+50 ' + state.players[0];
        document.getElementById('btn-ceza-1').textContent = '+50 ' + state.players[1];
        document.getElementById('btn-kafa-0').textContent = 'Kafa ' + state.players[0];
        document.getElementById('btn-kafa-1').textContent = 'Kafa ' + state.players[1];
      }

      const list = document.getElementById('hands-list');
      list.innerHTML = '';
      state.hands.forEach((hand, hi) => {
        const row = document.createElement('div');
        row.className = 'hand-row' + (hi + 1 >= 10 ? ' late' : '');
        let html = `<div class="hand-label">${hi + 1}.</div>`;
        const cols = state.mode === 'esli' ? 2 : Math.min(2, state.players.length);
        for (let i = 0; i < cols; i++) {
          html += `<input type="number" class="hand-input" inputmode="numeric" value="${hand[i] || 0}" oninput="setHandScore(${hi}, ${i}, this.value)">`;
        }
        row.innerHTML = html;
        list.appendChild(row);
      });
      updateRank();
    }

    function setHandScore(hi, ti, val) {
      const n = parseInt(val);
      state.hands[hi][ti] = isNaN(n) ? 0 : n;
      updateRank();
    }

    function addHand() {
      state.hands.push(emptyHand());
      renderGame();
      window.scrollTo(0, document.body.scrollHeight);
    }

    function quickAdd(teamIndex, amount) {
      // Son dolu olmayan / mevcut son ele ekle
      const last = state.hands.length - 1;
      state.hands[last][teamIndex] = Number(state.hands[last][teamIndex] || 0) + amount;
      renderGame();
    }

    function updateRank() {
      const t = totals();
      const pairs = state.players.map((p, i) => ({ name: p, score: t[i] }));
      pairs.sort((a, b) => a.score - b.score);
      document.getElementById('rank-list').innerHTML = pairs.map((p, i) =>
        `<div class="rank-line">${i + 1}. ${p.name}: ${p.score}</div>`
      ).join('');

      if (state.players.length >= 2) {
        const diff = Math.abs(t[0] - t[1]);
        document.getElementById('diff-line').textContent = 'Fark: ' + diff;
        if (t[0] < t[1]) document.getElementById('diff-sub').textContent = state.players[0] + ' önde';
        else if (t[1] < t[0]) document.getElementById('diff-sub').textContent = state.players[1] + ' önde';
        else document.getElementById('diff-sub').textContent = 'Berabere';

        const box = document.getElementById('rank-box');
        if (state.hands.length >= 10) box.style.background = '#4a2222';
        else box.style.background = '';
      }
    }

    function finishGame() {
      const t = totals();
      const min = Math.min(...t);
      const winners = state.players.filter((_, i) => t[i] === min);
      showScreen('screen-end');
      document.getElementById('winner-box').innerHTML =
        `<h2>Kazanan</h2><div style="font-size:1.3rem;font-weight:700;margin-top:6px">${winners.join(' & ')}</div><div class="small" style="margin-top:8px">${min} puan</div>`;
      document.getElementById('final-scores').innerHTML = '<h2>Final Skorlar</h2>' +
        state.players.map((p, i) => `<div style="display:flex;justify-content:space-between;margin:6px 0"><span>${p}</span><strong>${t[i]}</strong></div>`).join('');
    }

    function resetApp() {
      state = { game: null, mode: null, players: [], hands: [] };
      showScreen('screen-start');
      renderIddialar();
    }
    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }
    function goBack() {
      if (state.game === '101' && document.getElementById('screen-names').classList.contains('active')) {
        showScreen('screen-101-mode');
      } else {
        showScreen('screen-start');
        renderIddialar();
      }
    }

    renderIddialar();
  </script>
</body>
</html>
